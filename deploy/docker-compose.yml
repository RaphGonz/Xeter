services:

  # --- Infrastructure services ---

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xeter
      POSTGRES_USER: xeter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeter -d xeter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: >-
      -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
       && mc mb local/xeter-payloads --ignore-existing
       && mc anonymous set none local/xeter-payloads"

  db-init:
    build:
      context: ..
      dockerfile: services/presenter/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://xeter:${POSTGRES_PASSWORD}@postgres:5432/xeter"
    command: >-
      sh -c "python -m alembic -c xeter/migrations/alembic.ini upgrade head
       && python -m xeter.scripts.seed"
    restart: "no"

  # --- Application stub services ---

  analyser:
    build:
      context: ..
      dockerfile: services/presenter/Dockerfile
    ports:
      - "4318:4318"
    volumes:
      - ../xeter:/app/xeter
    command: uvicorn xeter.services.analyser.main:app --host 0.0.0.0 --port 4318 --reload
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://xeter:${POSTGRES_PASSWORD}@postgres:5432/xeter"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      MINIO_ENDPOINT: http://minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: xeter-payloads

  presenter:
    build:
      context: ..
      dockerfile: services/presenter/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../xeter:/app/xeter
    command: uvicorn xeter.services.presenter.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      diagnosticer:
        condition: service_started
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://xeter:${POSTGRES_PASSWORD}@postgres:5432/xeter"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      MINIO_ENDPOINT: http://minio:9000
      SECRET_KEY: ${SECRET_KEY}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: xeter-payloads
      DIAGNOSTICER_URL: http://diagnosticer:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}

  embedder:
    build:
      context: ..
      dockerfile: services/embedder/Dockerfile
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedder:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://xeter:${POSTGRES_PASSWORD}@postgres:5432/xeter"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      EMBEDDER_URL: http://embedder:8002
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: xeter-payloads
      WORKER_THRESHOLD_WRONG_TOOL_ARGS: "0.2"
      WORKER_THRESHOLD_UNNECESSARY_TOOL_CALL: "0.25"
      WORKER_THRESHOLD_NO_TOOL: "0.25"
      WORKER_THRESHOLD_RESPONSE_ANOMALY: "0.1"
      WORKER_THRESHOLD_CONTEXT_OVERFLOW: "8000"
      WORKER_THRESHOLD_MISSING_DETAILS: "0.65"
      WORKER_THRESHOLD_STALE_CONTEXT: "0.75"
      WORKER_THRESHOLD_CONTEXT_PROPAGATION_FAILURE: "0.35"
      WORKER_THRESHOLD_HISTORY_LOSS: "0.95"
      WORKER_THRESHOLD_STEP_REPETITION: "85.0"
      WORKER_THRESHOLD_TERMINATION_LOOP_N: "3.0"
      WORKER_THRESHOLD_CONVERSATION_RESET: "0.3"
      WORKER_THRESHOLD_INFORMATION_WITHHOLDING: "0.95"
      WORKER_THRESHOLD_INCOMPLETE_VERIFICATION: "0.95"

  diagnosticer:
    build:
      context: ..
      dockerfile: services/diagnosticer/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ../xeter:/app/xeter
    command: uvicorn xeter.services.diagnosticer.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql+asyncpg://xeter:${POSTGRES_PASSWORD}@postgres:5432/xeter"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: xeter-payloads
      SECRET_KEY: ${SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DIAGNOSTICER_PROVIDER: ${DIAGNOSTICER_PROVIDER:-anthropic}
      DIAGNOSTICER_MODEL: ${DIAGNOSTICER_MODEL:-claude-haiku-4-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  view:
    build:
      context: ..
      dockerfile: services/view/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../services/view/src:/app/src
      - ../services/view/public:/app/public
    environment:
      PRESENTER_URL: http://presenter:8000
      ENVIRONMENT: ${ENVIRONMENT:-dev}
    depends_on:
      presenter:
        condition: service_started

volumes:
  pg_data:
  ch_data:
  minio_data:
