services:

  # --- Infrastructure services ---

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xeter
      POSTGRES_USER: xeter
      POSTGRES_PASSWORD: xeter_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xeter -d xeter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: xeter_dev_password
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: xeter
      MINIO_ROOT_PASSWORD: xeter_dev_password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Application stub services ---

  analyser:
    build:
      context: ..
      dockerfile: services/analyser/Dockerfile
    ports:
      - "4318:4318"
    volumes:
      - ../services/analyser:/app/services/analyser
    command: uvicorn services.analyser.main:app --host 0.0.0.0 --port 4318 --reload
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://xeter:xeter_dev_password@postgres:5432/xeter
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000

  presenter:
    build:
      context: ..
      dockerfile: services/presenter/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../xeter:/app/xeter
    command: uvicorn xeter.services.presenter.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      diagnosticer:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://xeter:xeter_dev_password@postgres:5432/xeter
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: xeter_dev_password
      S3_BUCKET: xeter-payloads
      DIAGNOSTICER_URL: http://diagnosticer:8001

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://xeter:xeter_dev_password@postgres:5432/xeter
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: xeter_dev_password
      S3_BUCKET: xeter-payloads
      WORKER_THRESHOLD_WRONG_TOOL: "0.5"
      WORKER_THRESHOLD_WRONG_ARGS: "0.4"
      WORKER_THRESHOLD_NO_TOOL: "0.6"
      WORKER_THRESHOLD_EXCESSIVE_TOOL: "0.3"
      WORKER_THRESHOLD_PARSING_ERROR: "0.5"
      WORKER_THRESHOLD_RESPONSE_ANOMALY: "0.4"

  diagnosticer:
    build:
      context: ..
      dockerfile: services/diagnosticer/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ../xeter:/app/xeter
    command: uvicorn xeter.services.diagnosticer.main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://xeter:xeter_dev_password@postgres:5432/xeter
      CLICKHOUSE_HOST: clickhouse
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: xeter
      S3_SECRET_KEY: xeter_dev_password
      S3_BUCKET: xeter-payloads

  view:
    build:
      context: ..
      dockerfile: services/view/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../services/view:/app

volumes:
  pg_data:
  ch_data:
  minio_data:
