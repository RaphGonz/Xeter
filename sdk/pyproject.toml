[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xeter-sdk"
version = "0.1.0"
description = "Xeter SDK — instrument Python AI agents with one decorator"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
