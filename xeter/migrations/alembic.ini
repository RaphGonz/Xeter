# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to the location of this ini file.
script_location = %(here)s

# Template used to generate migration file names.
# %%(rev)s  — revision identifier
# %%(slug)s — short summary of the revision message
# %%(epoch)s — integer epoch timestamp of the revision creation
file_template = %%(rev)s_%%(slug)s

# Truncate long filenames at this length.
truncate_slug_length = 40

# Version path separator; os.pathsep is default.
version_path_separator = os

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# The sqlalchemy.url is intentionally left empty here.
# The actual DATABASE_URL is read from the DATABASE_URL environment variable
# in env.py at runtime. This avoids committing credentials.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
