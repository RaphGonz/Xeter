[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xeter"
version = "0.1.0"
description = "Xeter — AI observability and diagnostics platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]>=0.32",
    "pydantic==2.12.5",
    "sqlalchemy==2.0.48",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "clickhouse-connect==0.15.0",
    "aioboto3==15.5.0",
    "passlib[bcrypt]>=1.7",
    "python-dotenv",
    "structlog",
    "httpx",
    "pytest",
    "pytest-asyncio==0.24.0",
    "anyio",
    "sentence-transformers>=5.0.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.35.0",
    "python-jose[cryptography]>=3.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
