# Detection patterns for _check_tool_use_violation (Phase 9)
# Editable without code rebuild (NOTOOL-04).
# Reviewed and approved by user before Phase 9 implementation (NOTOOL-06).
#
# --- HYBRID DETECTION APPROACH (approved 2026-04-06) ---
#
# Phase 9 uses a two-stage hybrid strategy to detect "do not use this tool" intent:
#
# Stage 1 — Static list matching (this file):
#   tool_triggering_terms is a static fallback.
#   The algorithm scans the prompt for any term in this list, then checks
#   whether a negation_motif appears 1-4 words before it.
#   Example: "don't use tools" — "don't" is a negation motif, "use" is a
#   tool_triggering_term, distance = 1 word → high-confidence match.
#
# Stage 2 — Dynamic tool-name BOW matching (implemented in Phase 9 code):
#   The actual tool name from the span is tokenised (split on _, -, camelCase).
#   The resulting token set is checked against the negation window in the prompt.
#   This catches cases the static list cannot: e.g. tool "planX" produces tokens
#   {"plan", "x"}; if "plan" appears after a negation motif → match.
#   BOW = bag-of-words set intersection. No embeddings required.
#
# The two stages are OR-combined: either a static-list hit OR a dynamic BOW hit
# is sufficient to flag a negation-of-tool-use violation.

negation_motifs:
  - "do not"
  - "don't"
  - "never"
  - "avoid"
  - "without"
  - "skip"
  - "no"
  - "refrain from"
  - "instead of"
  - "rather than"

# Static fallback only — see Stage 2 (dynamic tool-name BOW) comment above.
tool_triggering_terms:
  - "use"
  - "call"
  - "invoke"
  - "run"
  - "execute"
  - "fetch"
  - "search"
  - "query"
  - "look up"
  - "retrieve"
  - "check"
  - "get"
